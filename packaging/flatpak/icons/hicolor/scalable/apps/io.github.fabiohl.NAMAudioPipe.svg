<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Outer Rim Accent Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Tube Glass Dome Fill -->
    <linearGradient id="tubeGlassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="75%" stop-color="#0F172A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.08" />
    </linearGradient>

    <!-- Glowing Vacuum Tube Filament Gradient -->
    <linearGradient id="filamentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Tube Glow Filter -->
    <filter id="tubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neural Node Glow Filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shadow for Squircle Elevation -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- DSP Wave Gradient -->
    <linearGradient id="dspWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Pipe Flange Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Neural Edge Gradient -->
    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="edgeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. BASE CONTAINER (12% Safe HIG Margin)    -->
  <!-- ========================================== -->
  <rect x="14" y="14" width="100" height="100" rx="24"
        fill="url(#bgGrad)"
        stroke="url(#rimGrad)"
        stroke-width="2.5"
        filter="url(#squircleShadow)" />

  <!-- Inner High-Tech Grid Pattern (Subtle) -->
  <line x1="28" y1="44" x2="100" y2="44" stroke="#334155" stroke-width="0.7" stroke-dasharray="2,4" stroke-opacity="0.4" />
  <line x1="28" y1="64" x2="100" y2="64" stroke="#334155" stroke-width="0.7" stroke-dasharray="2,4" stroke-opacity="0.4" />
  <line x1="28" y1="84" x2="100" y2="84" stroke="#334155" stroke-width="0.7" stroke-dasharray="2,4" stroke-opacity="0.4" />

  <!-- ========================================== -->
  <!-- 2. PIPEWIRE AUDIO CONDUITS (TOP / BOTTOM)  -->
  <!-- ========================================== -->
  <!-- Top Audio Inlet Pipe -->
  <rect x="58" y="15" width="12" height="11" rx="2" fill="url(#pipeGrad)" />
  <rect x="54" y="23" width="20" height="4" rx="2" fill="#64748B" stroke="#1E293B" stroke-width="0.8" />
  <!-- Bottom Audio Outlet Pipe -->
  <rect x="58" y="102" width="12" height="11" rx="2" fill="url(#pipeGrad)" />
  <rect x="54" y="101" width="20" height="4" rx="2" fill="#64748B" stroke="#1E293B" stroke-width="0.8" />

  <!-- ========================================== -->
  <!-- 3. THERMIONIC VACUUM TUBE SILHOUETTE       -->
  <!-- ========================================== -->
  <!-- Tube Base Socket -->
  <path d="M 48,88 L 80,88 L 76,96 L 52,96 Z" fill="#334155" stroke="#1E293B" stroke-width="1" />
  <circle cx="56" cy="92" r="1.5" fill="#94A3B8" />
  <circle cx="64" cy="92" r="1.5" fill="#94A3B8" />
  <circle cx="72" cy="92" r="1.5" fill="#94A3B8" />

  <!-- Internal Grid Screen (Placa / Anodo) -->
  <rect x="49" y="44" width="30" height="38" rx="3" fill="#1E293B" fill-opacity="0.6" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Thermionic Warm Filament (Heater / Cathode) with Glow -->
  <!-- Glow underlay -->
  <path d="M 57,80 L 64,40 L 71,80" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#tubeGlow)" />
  <path d="M 57,80 L 64,40 L 71,80" fill="none" stroke="url(#filamentGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#tubeGlow)" />
  <!-- Center incandescent spot -->
  <circle cx="64" cy="40" r="3.5" fill="#FFFBEB" filter="url(#nodeGlow)" />

  <!-- Glass Envelope Outer Body -->
  <path d="M 44,52 C 44,30 52,26 64,26 C 76,26 84,30 84,52 L 84,82 C 84,87 80,90 74,90 L 54,90 C 48,90 44,87 44,82 Z"
        fill="url(#tubeGlassGrad)"
        stroke="#64748B"
        stroke-width="1.8"
        stroke-opacity="0.6" />

  <!-- Glass Specular Reflection Highlight (Left Curved Sheen) -->
  <path d="M 48,50 C 48,35 53,30 61,28" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.45" />
  <path d="M 47,56 L 47,76" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- ========================================== -->
  <!-- 4. NEURAL NETWORK GRAPH (WaveNet/LSTM)    -->
  <!-- ========================================== -->
  <!-- Synaptic Connections / Flow Lines -->
  <g stroke-width="1.2" stroke-linecap="round">
    <!-- Input to Hidden Layer Connections -->
    <line x1="28" y1="46" x2="48" y2="64" stroke="url(#edgeCyan)" />
    <line x1="28" y1="82" x2="48" y2="64" stroke="url(#edgeCyan)" />
    <line x1="28" y1="46" x2="64" y2="40" stroke="url(#edgeCyan)" stroke-dasharray="2,3" />
    <line x1="28" y1="82" x2="64" y2="88" stroke="url(#edgeCyan)" stroke-dasharray="2,3" />

    <!-- Core Hidden Connections -->
    <line x1="48" y1="64" x2="64" y2="40" stroke="#818CF8" stroke-opacity="0.8" stroke-width="1.5" />
    <line x1="48" y1="64" x2="64" y2="88" stroke="#818CF8" stroke-opacity="0.8" stroke-width="1.5" />
    <line x1="64" y1="40" x2="80" y2="64" stroke="#818CF8" stroke-opacity="0.8" stroke-width="1.5" />
    <line x1="64" y1="88" x2="80" y2="64" stroke="#818CF8" stroke-opacity="0.8" stroke-width="1.5" />

    <!-- Hidden to Output Connections -->
    <line x1="80" y1="64" x2="100" y2="46" stroke="url(#edgeAmber)" />
    <line x1="80" y1="64" x2="100" y2="82" stroke="url(#edgeAmber)" />
    <line x1="64" y1="40" x2="100" y2="46" stroke="url(#edgeAmber)" stroke-dasharray="2,3" />
    <line x1="64" y1="88" x2="100" y2="82" stroke="url(#edgeAmber)" stroke-dasharray="2,3" />
  </g>

  <!-- ========================================== -->
  <!-- 5. REAL-TIME AUDIO SINE WAVE OSCILLATION   -->
  <!-- ========================================== -->
  <!-- Glowing Underlay for Sine Wave -->
  <path d="M 20,64 C 28,42 38,42 48,64 C 58,86 70,86 80,64 C 90,42 100,42 108,64"
        fill="none"
        stroke="#00E5FF"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.25"
        filter="url(#nodeGlow)" />
  <!-- Crisp DSP Sine Waveform -->
  <path d="M 20,64 C 28,42 38,42 48,64 C 58,86 70,86 80,64 C 90,42 100,42 108,64"
        fill="none"
        stroke="url(#dspWaveGrad)"
        stroke-width="2.8"
        stroke-linecap="round" />

  <!-- ========================================== -->
  <!-- 6. NEURAL NODES (GRAPH VERTICES)           -->
  <!-- ========================================== -->
  <!-- Input Layer Nodes (Electric Cyan) -->
  <circle cx="28" cy="46" r="4.5" fill="#00E5FF" filter="url(#nodeGlow)" />
  <circle cx="28" cy="46" r="2.2" fill="#FFFFFF" />
  <circle cx="28" cy="82" r="4.5" fill="#00E5FF" filter="url(#nodeGlow)" />
  <circle cx="28" cy="82" r="2.2" fill="#FFFFFF" />

  <!-- Mid Hidden Layer Nodes (Digital Indigo / Cyan) -->
  <circle cx="48" cy="64" r="4" fill="#38BDF8" filter="url(#nodeGlow)" />
  <circle cx="48" cy="64" r="1.8" fill="#FFFFFF" />

  <circle cx="64" cy="88" r="3.8" fill="#818CF8" filter="url(#nodeGlow)" />
  <circle cx="64" cy="88" r="1.8" fill="#FFFFFF" />

  <circle cx="80" cy="64" r="4" fill="#F59E0B" filter="url(#nodeGlow)" />
  <circle cx="80" cy="64" r="1.8" fill="#FFFFFF" />

  <!-- Output Layer Nodes (Analog Amber / Orange) -->
  <circle cx="100" cy="46" r="4.5" fill="#F97316" filter="url(#nodeGlow)" />
  <circle cx="100" cy="46" r="2.2" fill="#FFFFFF" />
  <circle cx="100" cy="82" r="4.5" fill="#F97316" filter="url(#nodeGlow)" />
  <circle cx="100" cy="82" r="2.2" fill="#FFFFFF" />
</svg>
