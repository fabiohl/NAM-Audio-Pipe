  # MSRV job: validates compilation with rust-version from Cargo.toml (1.99.0).
  # rust-toolchain.toml pins `stable`, so RUSTUP_TOOLCHAIN is required to override it;
  # `rustup default` alone would be silently ignored by the toolchain file.
  msrv:
    name: msrv (1.99.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v7
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: actions/checkout@v7
        with:
          repository: fabiohl/NeuralAmpModeler-rs
          path: NeuralAmpModeler-rs
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Set up engine sibling symlink
        run: ln -sfn "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" "$RUNNER_WORKSPACE/NeuralAmpModeler-rs"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.99.0 --no-self-update --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          rustc_version=$(rustc --version)
          eng_type="GAP:missing_lockfile"
          eng_ver="unknown"
          eng_chk="none"
          if [ -f Cargo.lock ]; then
            read -r eng_type eng_ver eng_chk < <(awk '
              /^\[\[package\]\]/ { in_pkg=0 }
              /^name = "NeuralAmpModeler-rs"/ { in_pkg=1 }
              in_pkg && /^version = / { gsub(/"/, "", $3); ver=$3 }
              in_pkg && /^source = / { gsub(/"/, "", $3); src=$3 }
              in_pkg && /^checksum = / { gsub(/"/, "", $3); chk=$3 }
              END {
                if (!ver) {
                  print "GAP:engine_not_found unknown none"
                  exit 0
                }
