name: CI

# Fast disciplines only: utils/lints.sh (fmt check, check/clippy matrix, rustdoc, SPDX, policies,
# AppStream/desktop packaging) and utils/tests-quick.sh (cargo test --features testing, dev profile,
# non-daemon unit and offline integration tests). Lints and quick run as separate jobs so one cannot hide the other.
# Heavy/RT/daemon/io_uring certification work lives in long.yml (manual dispatch).
# Linux only: the product is a PipeWire host (x86_64 reference + aarch64).
on:
  push:
    branches: [main, dev, 'dev-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # x86_64 is the reference platform: canonical lints and quick QA suite disciplines.
  # libpipewire/libspa headers + clang feed pipewire-sys bindgen; `pipewire` + `pipewire-bin`
  # provide the private daemon, pw-cli and pw-play used by the integration tests;
  # appstream/desktop-file-utils feed the packaging lint phase.
  x86_64-linux-lints:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: actions/checkout@v7
        with:
          repository: fabiohl/NeuralAmpModeler-rs
          path: NeuralAmpModeler-rs
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Set up engine sibling symlink
        run: ln -sfn "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" "$RUNNER_WORKSPACE/NeuralAmpModeler-rs"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev pipewire pipewire-bin \
            appstream desktop-file-utils
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          eng_type="GAP:missing_lockfile"
          eng_ver="unknown"
          eng_chk="none"
          if [ -f Cargo.lock ]; then
            read -r eng_type eng_ver eng_chk < <(awk '
              /^\[\[package\]\]/ { in_pkg=0 }
              /^name = "NeuralAmpModeler-rs"/ { in_pkg=1 }
              in_pkg && /^version = / { gsub(/"/, "", $3); ver=$3 }
              in_pkg && /^source = / { gsub(/"/, "", $3); src=$3 }
              in_pkg && /^checksum = / { gsub(/"/, "", $3); chk=$3 }
              END {
                if (!ver) {
                  print "GAP:engine_not_found unknown none"
                  exit 0
                }
                if (src ~ /^registry\+/) {
                  type="registry"
                } else if (src ~ /^git\+/) {
                  type="git"
                } else if (src) {
                  type=src
                } else {
                  type="path"
                }
                printf "%s %s %s\n", type, ver, (chk ? chk : "none")
              }
            ' Cargo.lock)
          fi
          if aux_sha=$(git -C ../NeuralAmpModeler-rs rev-parse HEAD 2>/dev/null); then
            aux_engine="sha=$aux_sha"
          else
            aux_engine="GAP:sibling_absent"
          fi
          printf 'PHASE: provenance sha=%s package_version=%s engine_type=%s engine_version=%s engine_checksum=%s auxiliary_engine=%s\n' \
            "$sha" "$version" "$eng_type" "$eng_ver" "$eng_chk" "$aux_engine" | tee target/logs/ci-provenance.log
      # GitHub sets CI=true, so lints.sh verifies formatting (--check) instead of applying it.
      - name: Lints (fmt, check, clippy, doc, policies, packaging)
        run: ./utils/lints.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-lints
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-x86_64-linux-lints
          path: target/logs/**
          retention-days: 14

