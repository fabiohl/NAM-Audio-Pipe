                  type="registry"
                } else if (src ~ /^git\+/) {
                  type="git"
                } else if (src) {
                  type=src
                } else {
                  type="path"
                }
                printf "%s %s %s\n", type, ver, (chk ? chk : "none")
              }
            ' Cargo.lock)
          fi
          if aux_sha=$(git -C ../NeuralAmpModeler-rs rev-parse HEAD 2>/dev/null); then
            aux_engine="sha=$aux_sha"
          else
            aux_engine="GAP:sibling_absent"
          fi
          printf 'PHASE: provenance sha=%s package_version=%s engine_type=%s engine_version=%s engine_checksum=%s auxiliary_engine=%s rustc=%s toolchain=msrv-1.99.0\n' \
            "$sha" "$version" "$eng_type" "$eng_ver" "$eng_chk" "$aux_engine" "$rustc_version" | tee target/logs/ci-provenance.log
      - name: Cargo check (MSRV)
        run: |
          mkdir -p target/logs
          echo "PHASE: msrv" | tee -a target/logs/summary.txt
          rc=0
          t_start=$(date +%s)
          cargo check --locked --all-targets --all-features 2>&1 | tee target/logs/msrv-check.log || rc=$?
          elapsed=$(( $(date +%s) - t_start ))
          if [ "$rc" -eq 0 ]; then
            echo "PHASE: msrv PASS log=target/logs/msrv-check.log" | tee -a target/logs/summary.txt
            echo "RESULT: PASS (${elapsed}s) fails=none gaps=none" | tee -a target/logs/summary.txt
            printf '%s\t%s\t%s\t%s\n' msrv PASS none none > target/logs/msrv-status.tsv
          else
            echo "PHASE: msrv FAIL rc=$rc log=target/logs/msrv-check.log" | tee -a target/logs/summary.txt
            echo "RESULT: FAIL (${elapsed}s) fails=msrv gaps=none" | tee -a target/logs/summary.txt
            printf '%s\t%s\t%s\t%s\n' msrv FAIL none msrv > target/logs/msrv-status.tsv
            exit "$rc"
          fi
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: msrv (1.99.0)
          note: ${{ job.status == 'success' && 'MSRV cargo check passed.' || 'MSRV cargo check failed.' }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-msrv
          path: target/logs/**
          retention-days: 14
