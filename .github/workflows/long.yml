name: Long QA Suite

# Release chain, decoupled: build-release.sh -> tests-long.sh --artifact -> build-release.sh --certify.
# This hosted workflow never certifies and never runs rt-deadline/rt-jitter.
# Hosted runners lack an isolated CPU, BOLT, SCHED_FIFO privileges and a session manager: those
# surface as typed GAPs. With `strict: true` any GAP fails the run.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Strict mode (treat gaps as failures)'
        type: boolean
        default: false

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: actions/checkout@v7
        with:
          repository: fabiohl/NeuralAmpModeler-rs
          path: NeuralAmpModeler-rs
      - name: Set up engine sibling symlink
        run: ln -sfn "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" "$RUNNER_WORKSPACE/NeuralAmpModeler-rs"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev pipewire pipewire-bin \
            appstream desktop-file-utils binutils
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add llvm-tools-preview
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      # The live PipeWire (PHASE8) and PGO workload need a reachable daemon. A bare daemon (no
      # session manager) is enough for the application's own capture/playback nodes.
      - name: Start PipeWire daemon
        run: |
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" setsid nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] || { echo "PipeWire socket did not appear"; cat "$RUNNER_TEMP/pipewire.log"; exit 1; }
      - name: Record provenance
        run: |
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          eng_type="GAP:missing_lockfile"
          eng_ver="unknown"
          eng_chk="none"
          if [ -f Cargo.lock ]; then
            read -r eng_type eng_ver eng_chk < <(awk '
              /^\[\[package\]\]/ { in_pkg=0 }
              /^name = "NeuralAmpModeler-rs"/ { in_pkg=1 }
              in_pkg && /^version = / { gsub(/"/, "", $3); ver=$3 }
              in_pkg && /^source = / { gsub(/"/, "", $3); src=$3 }
              in_pkg && /^checksum = / { gsub(/"/, "", $3); chk=$3 }
              END {
                if (!ver) {
                  print "GAP:engine_not_found unknown none"
                  exit 0
                }
                if (src ~ /^registry\+/) {
                  type="registry"
                } else if (src ~ /^git\+/) {
                  type="git"
                } else if (src) {
                  type=src
                } else {
                  type="path"
                }
                printf "%s %s %s\n", type, ver, (chk ? chk : "none")
              }
            ' Cargo.lock)
          fi
          if aux_sha=$(git -C ../NeuralAmpModeler-rs rev-parse HEAD 2>/dev/null); then
            aux_engine="sha=$aux_sha"
          else
            aux_engine="GAP:sibling_absent"
          fi
          printf 'PHASE: provenance sha=%s package_version=%s engine_type=%s engine_version=%s engine_checksum=%s auxiliary_engine=%s\n' \
            "$sha" "$version" "$eng_type" "$eng_ver" "$eng_chk" "$aux_engine" | tee target/logs/ci-provenance.log
      - name: Build canonical artifact
        run: ./utils/build-release.sh
      - name: Long QA Suite (artifact)
        env:
          STRICT_INPUT: ${{ inputs.strict }}
        run: |
          STRICT_FLAG=""
          if [ "$STRICT_INPUT" = "true" ]; then STRICT_FLAG="--strict"; fi
          # Hosted runners are not a comparable speed/RT gate: rt-deadline and
          # rt-jitter are reserved for the operator's isolated host.
          ./utils/tests-long.sh $STRICT_FLAG --artifact \
            --only "catch-all,soak,heap-audit,concurrency,endurance,pw-resilience,pw-live,recording,offline-parity"
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/dist/build-receipt.json
            target/dist/release-receipt.json
          retention-days: 14
