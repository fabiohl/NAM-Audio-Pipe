name: Long QA Suite

# Hosted QA workflow with a single, recommended configuration. It is
# intentionally zero-input: the GitHub "Run workflow" button must not ask
# questions. The hosted build is never strict (the operator A/B ceremony
# receipt is unavailable here), the QA runs the hosted-safe phase list without
# rt-deadline/rt-jitter, and certification remains operator-only. BOLT, perf
# and the C++ parity oracle are provisioned below.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
          . ./variables.env
          [ -n "${ENGINE_COMMIT:-}" ] || { echo "ERROR: ENGINE_COMMIT missing in variables.env" >&2; exit 1; }
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fabiohl/NeuralAmpModeler-rs
          path: NeuralAmpModeler-rs
          ref: ${{ env.ENGINE_COMMIT }}
          persist-credentials: false
      - name: Set up engine sibling symlink
        run: ln -sfn "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" "$RUNNER_WORKSPACE/NeuralAmpModeler-rs"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev pipewire pipewire-bin \
            wireplumber dbus appstream desktop-file-utils binutils \
            llvm-bolt linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - name: Provision C++ parity oracle
        run: |
          cd "$GITHUB_WORKSPACE/NeuralAmpModeler-rs"
          utils/setup-third-party.sh
          oracle=$(utils/ensure_namcore_render.sh)
          test -x "$oracle"
          echo "NAM_CORE_RENDER_BIN=$oracle" >> "$GITHUB_ENV"
          echo "NAM_REQUIRE_CPP_ORACLE=1" >> "$GITHUB_ENV"
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add llvm-tools-preview
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      # The live PipeWire (PHASE8/PHASE9) and PGO workload need a reachable,
      # fully scheduled graph: a bare daemon has no session manager and no
      # driver node, so capture streams may never receive process() callbacks.
      - name: Start headless PipeWire graph (daemon, session manager, virtual nodes)
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # wireplumber requires a session bus; the daemon and the session
          # manager share this private one, and later steps inherit it.
          dbus-daemon --session --fork --print-address=1 > "$RUNNER_TEMP/dbus-address"
          dbus_address=$(sed -n '1p' "$RUNNER_TEMP/dbus-address")
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          setsid nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] || { echo "PipeWire socket did not appear"; cat "$RUNNER_TEMP/pipewire.log"; exit 1; }
          setsid nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          wireplumber_pid=$!
          # Fail closed if the session manager dies or never connects: the
          # create-node calls below succeed without it, so verifying the
          # WirePlumber client in the graph is what proves streams will link.
          for _ in $(seq 1 100); do
            if ! kill -0 "$wireplumber_pid" 2>/dev/null; then
              echo "wireplumber exited during startup"
              cat "$RUNNER_TEMP/wireplumber.log"
              exit 1
            fi
            pw-cli ls Client 2>/dev/null | grep -qi 'application.name = "WirePlumber"' && break
            sleep 0.1
          done
          pw-cli ls Client | tee "$RUNNER_TEMP/pipewire-clients.log"
          grep -qi 'application.name = "WirePlumber"' "$RUNNER_TEMP/pipewire-clients.log"
          # Persistent virtual drivers: a sink (graph scheduling clock) and a
          # source, so hosted runners without hardware audio still schedule the
          # host's capture/playback nodes.
          pw-cli create-node adapter '{ factory.name=support.null-audio-sink node.name=ci-null-sink media.class=Audio/Sink object.linger=true audio.position=[FL FR] }'
          pw-cli create-node adapter '{ factory.name=support.null-audio-sink node.name=ci-null-source media.class=Audio/Source/Virtual object.linger=true audio.position=[FL FR] }'
          pw-cli ls Node | tee "$RUNNER_TEMP/pipewire-nodes.log"
          grep -q ci-null-sink "$RUNNER_TEMP/pipewire-nodes.log"
          grep -q ci-null-source "$RUNNER_TEMP/pipewire-nodes.log"
      - name: Record provenance
        run: |
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          eng_type="GAP:missing_lockfile"
          eng_ver="unknown"
          eng_chk="none"
          if [ -f Cargo.lock ]; then
            read -r eng_type eng_ver eng_chk < <(awk '
              /^\[\[package\]\]/ { in_pkg=0 }
              /^name = "NeuralAmpModeler-rs"/ { in_pkg=1 }
              in_pkg && /^version = / { gsub(/"/, "", $3); ver=$3 }
              in_pkg && /^source = / { gsub(/"/, "", $3); src=$3 }
              in_pkg && /^checksum = / { gsub(/"/, "", $3); chk=$3 }
              END {
                if (!ver) {
                  print "GAP:engine_not_found unknown none"
                  exit 0
                }
                if (src ~ /^registry\+/) {
                  type="registry"
                } else if (src ~ /^git\+/) {
                  type="git"
                } else if (src) {
                  type=src
                } else {
                  type="path"
                }
                printf "%s %s %s\n", type, ver, (chk ? chk : "none")
              }
            ' Cargo.lock)
          fi
          if aux_sha=$(git -C "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" rev-parse HEAD 2>/dev/null); then
            aux_engine="sha=$aux_sha"
          else
            aux_engine="GAP:sibling_absent"
          fi
          rustc_v=$(rustc --version)
          cargo_v=$(cargo --version)
          printf 'PHASE: provenance sha=%s package_version=%s engine_type=%s engine_version=%s engine_checksum=%s auxiliary_engine=%s rustc=%s cargo=%s\n' \
            "$sha" "$version" "$eng_type" "$eng_ver" "$eng_chk" "$aux_engine" "$rustc_v" "$cargo_v" | tee target/logs/ci-provenance.log
      - name: Record capability matrix
        run: |
          mkdir -p target/logs
          cargo build --locked --quiet --bin io_uring_probe
          set +e
          target/debug/io_uring_probe
          io_rc=$?
          set -e
          case "$io_rc" in
            0) io=ok ;;
            1) io=GAP:io_uring_unsupported ;;
            *) io="FAIL:io_uring_probe_rc$io_rc" ;;
          esac
          pw=GAP:pw_cli_unavailable
          if command -v pw-cli >/dev/null 2>&1 && timeout 5 pw-cli info 0 >/dev/null 2>&1; then pw=ok; fi
          play=GAP:pw_play_unavailable
          if command -v pw-play >/dev/null 2>&1 && pw-play --version >/dev/null 2>&1; then play=ok; fi
          oracle=GAP:cpp_oracle_unavailable
          if [ -n "${NAM_CORE_RENDER_BIN:-}" ] && [ -x "$NAM_CORE_RENDER_BIN" ]; then oracle=ok; fi
          printf 'PHASE: capabilities io_uring=%s pipewire=%s pw_play=%s cpp_oracle=%s\n' \
            "$io" "$pw" "$play" "$oracle" | tee target/logs/ci-capabilities.log | tee -a target/logs/summary.txt
          printf '%s\n' "$NAM_RUN_ID" > target/logs/.summary-run
          [ "$io_rc" -le 1 ] || exit 1
      - name: Build canonical artifact
        # Hosted QA builds are never strict: --strict requires the operator's
        # A/B ceremony receipt, which this runner cannot produce. The workflow
        # never uses --strict; the operator release chain owns it.
        run: ./utils/build-release.sh
      - name: Long QA Suite (artifact)
        # Recommended hosted-safe configuration, fixed by design. rt-deadline
        # and rt-jitter are reserved for the operator's isolated host; the
        # build above is non-strict. No dispatch inputs are required.
        run: >-
          ./utils/tests-long.sh --artifact --only
          'catch-all,soak,heap-audit,concurrency,endurance,pw-resilience,pw-live,recording,offline-parity'
      - name: Write evidence manifest
        if: always()
        run: |
          mkdir -p target/logs
          build=false; if [ -f target/dist/build-receipt.json ]; then build=true; fi
          long_scope=none
          if [ -f target/logs/long-audit-receipt.jsonl ]; then long_scope=full
          elif [ -f target/logs/long-audit-receipt.partial.jsonl ]; then long_scope=partial
          fi
          certify=false
          if [ -f target/dist/release-receipt.json ]; then certify=true; fi
          printf '{"run_id":"%s","build_receipt":%s,"long_receipt_scope":"%s","certification_receipt":%s}\n' \
            "$NAM_RUN_ID" "$build" "$long_scope" "$certify" > target/logs/evidence-manifest.json
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/dist/build-receipt.json
            target/dist/release-receipt.json
          if-no-files-found: error
          retention-days: 14
