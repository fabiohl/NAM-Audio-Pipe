[package]
name = "nam-audio-pipe"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/fabiohl/NAM-Audio-Pipe"
description = "Low-latency PipeWire standalone client for Neural Amp Modeler (NAM)."
readme = "README.md"
authors = ["Fábio Henrique de Lima Silva <fhl.bsb@gmail.com>"]
keywords = ["audio", "dsp", "nam", "neural-amp-modeler", "guitar", "pipewire"]
categories = ["multimedia::audio", "multimedia"]
# All binary targets are declared explicitly via [[bin]] below. autobins = false
# prevents Cargo from auto-discovering every src/bin/*.rs as a crate target,
# which would otherwise compile pgo_workload_test.rs (a #[cfg(test)] module
# included by pgo_workload.rs) as a standalone binary.
autobins = false

[[bin]]
name = "nam-audio-pipe"
path = "src/main.rs"

[[bin]]
name = "io_uring_probe"
path = "src/bin/io_uring_probe.rs"

[[bin]]
name = "pgo_workload"
path = "src/bin/pgo_workload.rs"
required-features = ["testing"]

# Unified-schema (engine `testing::receipt`) emitter/verifier for the
# machine-readable long receipt (target/logs/long-audit-receipt.jsonl).
# Testing-only because it reuses the engine receipt schema.
[[bin]]
name = "pipe_long_receipt"
path = "src/bin/pipe_long_receipt.rs"
required-features = ["testing"]

# Typed CPU topology helper for the QA scripts: resolves the RT/bench core with
# the engine policy and applies the affinity before exec'ing a command, so no
# script needs literal `taskset` or sysfs parsing.
[[bin]]
name = "pipe_perf_gate"
path = "src/bin/pipe_perf_gate.rs"

# A/B benchmark of the recording transports (inline SPSC ring
# vs preallocated pool + small descriptor). A profiling-only harness like
# pgo_workload: excluded from the standard test path, compiled only when the
# `testing` feature is active.
[[bin]]
name = "recording_ab_bench"
path = "src/bin/recording_ab_bench.rs"
required-features = ["testing"]

# A/B optimization benchmark of the DSP hot-path envelope
# (plain → PGO → PGO+BOLT). A profiling-only harness like pgo_workload: excluded
# from the standard test path, compiled only when the `testing` feature is
# active. The comparison ceremony is executed by utils/ab-opt-ceremony.sh.
[[bin]]
name = "ab_opt_bench"
path = "src/bin/ab_opt_bench.rs"
required-features = ["testing"]

# Typed comparison stage of the A/B optimization ceremony: reads the variant
# JSONL receipts, applies the promotion rule and writes the ceremony receipt
# consumed by the release chain. Free of `required-features` so the operator
# script can run it without the `testing` feature.
[[bin]]
name = "pipe_ab_opt"
path = "src/bin/pipe_ab_opt.rs"

# RT regression gate Criterion harness: promotes the offline
# rt_deadline real-load scenario to a per-scenario Criterion suite consumed by
# the engine `nam_perf_gate` (coverage + machine verdict). Testing-only, because
# the RT harness used to drive the callbacks is test-only.
[[bench]]
name = "rt_gate"
path = "benches/rt_gate.rs"
harness = false
required-features = ["testing"]

[dependencies]
# `default-features = false` keeps the engine's `dual-mono` off unless this
# crate's own `dual-mono` feature (enabled by default) forwards it. Without it,
# Cargo would pull the engine's default features and `--no-default-features`
# could never reach the lean single-inference path (the engine default is
# `dual-mono`).
NeuralAmpModeler-rs = { version = "1.0.1", default-features = false, features = [
    "rt-hardening",
] }
pipewire = "0.10"
lexopt = "0.3.2"
hound = "3.5"
rtrb = "0.4.0"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
tokio-uring = "0.5"
anyhow = "1.0.104"
libc = "0.2.191"
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false }
# Typed FAIL-cause carrier for the long audit (src/receipt/fail_reasons.rs):
# the engine-owned unified receipt schema has no `fail_reason` field, so
# the cause is emitted to a sibling `*.fail-reasons.json` JSONL. Already in the
# dependency tree transitively via NeuralAmpModeler-rs.
serde_json = "1"
# Typed build/release receipts (`receipt::build`, `receipt::release`):
# derive-based (de)serialization and file hashing for the artifact chain.
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = { version = "0.11", optional = true }

[features]
default = ["dual-mono"]
# True stereo DSP: enables the engine's dual-mono feature so the unified
# L/R pipeline processes each channel independently instead of folding R as a
# mono copy of L (mono detection becomes dynamic per-block).
dual-mono = ["NeuralAmpModeler-rs/dual-mono"]
testing = [
    "NeuralAmpModeler-rs/testing",
    "dual-mono",
    "dep:serde",
    "dep:sha2",
]
# Enables the RT heap-audit allocator (CountingAllocator) and the swap
# zero-allocation gates.
heap-audit = ["NeuralAmpModeler-rs/heap-audit"]
# Opt-in engine RT hardening (THP/mlockall/SCHED_FIFO/affinity/PM-QoS).
# The engine feature is unconditionally enabled above; this flag mirrors it
# for feature-matrix uniformity (lints --all-features, docs).
rt-hardening = ["NeuralAmpModeler-rs/rt-hardening"]


[dev-dependencies]
# Criterion statistical harness for the RT regression gate (benches/rt_gate.rs).
criterion = { version = "0.8", default-features = false }
# Property-based testing for AlignedBlock invariants and future fuzz targets.
proptest = "1.12.0"
# Distribution QA harness: strict XML well-formedness parsing for
# the AppStream metainfo audit (tests/distribution_qa.rs).
quick-xml = "0.42"
# Test harness: SHA-256 digest of the committed model fixtures
# (tests/pipe_offline_parity.rs and tests/fixtures_freshness.rs).
sha2 = "0.11"

[lints.clippy]
allow_attributes = "warn"
# Every `unsafe` block/expression must carry a `// SAFETY:` comment documenting
# its invariant and pointer provenance; enforces the §4 hygiene contract by
# machine instead of by line-count heuristic.
undocumented_unsafe_blocks = "warn"

# Profile Configuration: `dist` intentionally inherits `panic = "unwind"` from `release`.
#
# - `release` keeps `panic = "unwind"`: the `--release --lib` suite run by
#   `tests-long.sh` relies on `catch_unwind` to prove panics inside RT callbacks
#   never cross the PipeWire `extern "C"` boundary.
#   Uniformizing `release` to `panic = "abort"` would make that evidence unusable.
# - `dist` is the profile effectively distributed by `utils/build-release.sh`
#   (stripped, LTO fat) — the exact artifact certified by the release
#   ceremony. It also inherits `unwind`: under `panic = "abort"` the
#   `std::panic::catch_unwind` wrapper around the RT callbacks
#   (`run_rt_callback_body`) could never catch — a panic would still
#   `abort` with a corrupted recording. Keeping `unwind` makes the contained
#   teardown guarantee (WAV finalized, ordered shutdown) real in the artifact
#   users actually install. The wrapper prevents the panic from ever reaching
#   the extern "C" boundary, guaranteeing orderly recovery and data safety.
[profile.release]
strip = true
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "unwind"

# Criterion builds (`cargo bench`, `cargo bench --no-run`) inherit `release` by
# default — fat LTO at a single codegen unit, the largest peak-memory operation
# in this repository. Thin LTO keeps cross-crate inlining while bounding memory
# on a 16 GiB host. Consequence: codegen differs from the shipped fat-LTO
# `release`/`dist` binaries; re-bootstrap Criterion baselines before treating a
# regression check as authoritative.
[profile.bench]
lto = "thin"
codegen-units = 16

# The shipped profile (see the note on `release` above).
[profile.dist]
inherits = "release"

[profile.dev]
debug = 1
opt-level = 0
incremental = true
split-debuginfo = "unpacked"

[lints.rust]
raw_borrows_via_references = "warn"
