[package]
name = "nam-audio-pipe"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/fabiohl/NAM-Audio-Pipe"
description = "Low-latency PipeWire standalone client for Neural Amp Modeler (NAM)."
readme = "README.md"
authors = ["Fábio Henrique de Lima Silva <fhl.bsb@gmail.com>"]
keywords = ["audio", "dsp", "nam", "neural-amp-modeler", "guitar", "pipewire"]
categories = ["multimedia::audio", "multimedia"]

[[bin]]
name = "nam-audio-pipe"
path = "src/main.rs"

[[bin]]
name = "io_uring_probe"
path = "src/bin/io_uring_probe.rs"

[[bin]]
name = "pgo_workload"
path = "src/bin/pgo_workload.rs"
required-features = ["testing"]

[dependencies]
# S7.T1: pinned to the local motor 0.5.0 (path) — crates.io 0.4.0 is NOT mixed in.
NeuralAmpModeler-rs = { path = "../NeuralAmpModeler-rs", version = "0.5.0" }
pipewire = "0.10"
lexopt = "0.3.2"
hound = "3.5"
rtrb = "0.3.4"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-uring = "0.5"
anyhow = "1.0.104"
libc = "0.2.189"
log = "0.4.33"
env_logger = { version = "0.11.11", default-features = false }

[features]
default = []
testing = ["NeuralAmpModeler-rs/testing"]

[lints.clippy]
allow_attributes = "warn"

[profile.release]
strip = true
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "unwind"

[profile.dist]
inherits = "release"
panic = "abort"

[profile.dev]
debug = 1
opt-level = 0
incremental = true
split-debuginfo = "unpacked"
