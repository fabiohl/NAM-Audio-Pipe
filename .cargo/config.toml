[build]
warnings = "deny"

# NOTE: The libm shadow version-script (--version-script=hide-libm-shadow.map)
# and its --undefined-version flag are NOT listed here. They are injected by
# build.rs via `cargo:rustc-link-arg` instead. If added as blanket rustflags,
# they would also apply to every dependency build-script helper binary, and
# rust-lld rejects a version-script entry that references a symbol not defined
# in that binary — most helper binaries define none of the masked libm symbols.
# build.rs scopes the flag only to this crate's link targets.
#
# See build.rs:20-22 and .cargo/hide-libm-shadow.map for the full analysis.

# --- Architecture and Optimization Configuration (march / mtune) ---
# Scoped to x86_64: an unconditional `-Ctarget-cpu=x86-64-v3` is an unknown
# processor on aarch64 and the engine build script rejects the target.
[target.'cfg(target_arch = "x86_64")']
rustflags = [
  # OPTION 1 (Distributable Default):
  # Minimum hard requirement: CPUs with AVX2, FMA, and BMI2 (2013+).
  # Note: On Rust Stable, '-Ctarget-cpu' sets BOTH the ISA (march) and generic tuning (mtune).
  "-Ctarget-cpu=x86-64-v3",

  # OPTION 2 (Maximum Local Optimization - "Native"):
  # Sets both march and mtune for your own current CPU.
  # WARNING: The resulting binary will be incompatible with older or different-family processors.
  # "-Ctarget-cpu=native",
]

# --- Linker Optimizations (Linux, any architecture) ---
[target.'cfg(target_os = "linux")']
rustflags = [
  # Remove dead code to reduce final binary size.
  "-Clink-arg=-Wl,--gc-sections",

  # CRITICAL FOR REAL-TIME (DSP): Forces dynamic symbol resolution at startup (Bind Now).
  # Prevents OS lazy-binding (e.g. calls to libm or libc) from occurring unexpectedly
  # during the audio DSP thread, which would cause lockups and XRuns (execution page-faults).
  "-Clink-arg=-Wl,-z,now",

  # Improves load speed by discarding listed libraries that are not actually used.
  "-Clink-arg=-Wl,--as-needed",
]
